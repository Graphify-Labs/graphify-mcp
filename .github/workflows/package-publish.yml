name: Publish OpenClaw Package

on:
  pull_request:
    paths:
      - "integrations/openclaw/**"
      - ".github/workflows/package-publish.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only; set to false to publish a bumped package version."
        required: true
        type: boolean
        default: true
      changelog:
        description: "Release changelog for ClawHub."
        required: true
        type: string
        default: "Publish Graphify MCP OpenClaw package update."

permissions: {}

jobs:
  dry-run:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      id-token: write
    uses: openclaw/clawhub/.github/workflows/package-publish.yml@v0.24.0
    with:
      dry_run: true
      source_path: integrations/openclaw
      owner: graphify-labs
      topics: mcp,code-search,knowledge-graph

  publish:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
    uses: openclaw/clawhub/.github/workflows/package-publish.yml@v0.24.0
    with:
      dry_run: ${{ inputs.dry_run }}
      source_path: integrations/openclaw
      owner: graphify-labs
      topics: mcp,code-search,knowledge-graph
      changelog: ${{ inputs.changelog }}
      wait_for_publication: true
      publication_timeout_minutes: 30
